name: Set up workspace
description: Install the repository's Node, pnpm, and frozen dependencies.
inputs:
  node-version:
    description: Override the version in .node-version.
    required: false
    default: ""
  working-directory:
    description: Directory containing the workspace checkout.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.working-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
