name: Set up workspace
description: Install the repository's Node, pnpm, and frozen dependencies.
inputs:
  node-version:
    description: Override the version in .node-version.
    required: false
    default: ""
  working-directory:
    description: Directory containing the workspace checkout.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Keep temporary files on the runner disk
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
    - name: Install Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.working-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
    - name: Cache process monitor build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ${{ inputs.working-directory }}/native/process-monitor/target
        key: process-monitor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/native/process-monitor/Cargo.lock', inputs.working-directory), format('{0}/rust-toolchain.toml', inputs.working-directory)) }}
    - name: Install Rust toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: rustup toolchain install
