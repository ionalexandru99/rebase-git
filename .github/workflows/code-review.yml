name: Code review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sol:
    name: gpt-6.1-sol
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/review-with-codex.yml
    with:
      model: gpt-6.1-sol
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  astra:
    name: gpt-6-astra fallback
    needs: sol
    if: "!cancelled() && needs.sol.result != 'skipped' && needs.sol.outputs.result == ''"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/review-with-codex.yml
    with:
      model: gpt-6-astra
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publish:
    name: Publish review
    needs: [sol, astra]
    if: "!cancelled() && (needs.sol.outputs.result != '' || needs.astra.outputs.result != '')"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Submit review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_RESULT: ${{ needs.sol.outputs.result || needs.astra.outputs.result }}
        run: |
          node --input-type=module <<'EOF'
          const { verdict, summary, findings } = JSON.parse(process.env.REVIEW_RESULT)
          const submit = (review) =>
            fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/pulls/${process.env.PR_NUMBER}/reviews`, {
              method: "POST",
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: JSON.stringify({ commit_id: process.env.HEAD_SHA, ...review }),
            })

          const inline = await submit({
            body: summary,
            event: verdict === "approve" && findings.length === 0 ? "APPROVE" : "COMMENT",
            comments: findings.map(({ path, line, body }) => ({ path, line, side: "RIGHT", body })),
          })
          if (inline.ok) process.exit(0)
          console.log(`Inline review rejected with ${inline.status}: ${await inline.text()}`)

          const listed = findings.map(({ path, line, body }) => `- \`${path}:${line}\` ${body}`)
          const plain = await submit({ body: [summary, ...listed].join("\n\n"), event: "COMMENT" })
          if (!plain.ok) {
            throw new Error(`GitHub returned ${plain.status}: ${await plain.text()}`)
          }
          EOF
