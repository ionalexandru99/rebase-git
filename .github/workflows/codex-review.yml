name: Codex review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Review pull request
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          effort: high
          sandbox: read-only
          codex-args: '["--ephemeral"]'

  publish:
    name: Publish review
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update review comment
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            const marker = "<!-- codex-review -->";
            const body = `${marker}\n## Codex review\n\n${process.env.CODEX_REVIEW}`;
            const coordinates = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(
              github.rest.issues.listComments,
              coordinates,
            );
            const previous = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: coordinates.owner,
                repo: coordinates.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...coordinates,
                body,
              });
            }
