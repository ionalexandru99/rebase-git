name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check GitHub workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color
      - uses: ./.github/actions/setup-workspace
      - name: Validate quality
        run: pnpm validate:quality
      - name: Verify release validation gate without publishing
        run: node --test tests/package/release-validation.test.ts
      - uses: ./.github/actions/upload-test-results
        if: always()

  platforms:
    name: Platform (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, Node 22
            runner: ubuntu-latest
            node-version: 22.18.0
          - name: macOS
            runner: macos-latest
            node-version: ""
          - name: Windows
            runner: windows-latest
            node-version: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace with spaces
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workspace with spaces
          persist-credentials: false
      - uses: ./workspace with spaces/.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: workspace with spaces
      - name: Test Node 22 compatibility
        if: matrix.node-version == '22.18.0'
        run: pnpm test:unit
      - name: Build desktop and run integration tests
        run: pnpm validate:integration
      - name: Verify macOS signing keychain
        if: runner.os == 'macOS'
        run: node --test tests/package/macos-keychain.test.ts
      - name: Pack npm package
        shell: bash
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact
      - name: Smoke-test clean npm installation
        run: node tests/package/smoke-packed-package.ts package-artifact
      - name: Install Electron
        run: pnpm exec install-electron
      - name: Package and launch desktop application
        if: runner.os != 'Linux'
        run: pnpm test:release-smoke:prepared
      - name: Package and launch desktop application under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:release-smoke:prepared
      - uses: ./workspace with spaces/.github/actions/upload-test-results
        if: always()
        with:
          path: workspace with spaces/tests/.artifacts/

  browser:
    name: Browser and desktop journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser and Electron
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec install-electron
      - name: Validate browser
        run: pnpm validate:browser
      - name: Build desktop application
        run: pnpm build:desktop-package
      - name: Run browser and desktop journeys
        run: xvfb-run --auto-servernum pnpm test:e2e:prepared
      - uses: ./.github/actions/upload-test-results
        if: always()

  validation:
    name: Validation
    if: always()
    needs:
      - quality
      - platforms
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify validation jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
