name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check GitHub workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color
      - uses: ./.github/actions/setup-workspace
      - name: Validate quality
        run: pnpm validate:quality
      - uses: ./.github/actions/upload-test-results
        if: always()

  integration:
    name: Integration (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, Node 22
            runner: ubuntu-latest
            node-version: 22.18.0
            shard: 1/1
          - name: macOS
            runner: macos-latest
            node-version: ""
            shard: 1/1
          - name: Windows 1 of 2
            runner: windows-latest
            node-version: ""
            shard: 1/2
          - name: Windows 2 of 2
            runner: windows-latest
            node-version: ""
            shard: 2/2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace with spaces
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workspace with spaces
          persist-credentials: false
      - uses: ./workspace with spaces/.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: workspace with spaces
      - name: Test Node 22 compatibility
        if: matrix.node-version == '22.18.0'
        run: pnpm test:unit
      - name: Build web client
        run: pnpm build:web
      - name: Run integration tests
        run: pnpm test:integration:prepared --shard=${{ matrix.shard }}
      - uses: ./workspace with spaces/.github/actions/upload-test-results
        if: always()
        with:
          name: ${{ github.job }}-${{ strategy.job-index }}
          path: workspace with spaces/tests/.artifacts/

  packaging:
    name: Packaging (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, Node 22
            runner: ubuntu-latest
            node-version: 22.18.0
          - name: macOS
            runner: macos-latest
            node-version: ""
          - name: Windows
            runner: windows-latest
            node-version: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace with spaces
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: workspace with spaces
          persist-credentials: false
      - uses: ./workspace with spaces/.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          working-directory: workspace with spaces
      - name: Pack npm package
        shell: bash
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact
      - name: Smoke-test clean npm installation
        timeout-minutes: 10
        run: node tests/package/smoke-packed-package.ts package-artifact
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('workspace with spaces/pnpm-lock.yaml') }}
      - name: Install Electron
        run: pnpm exec install-electron
      - name: Package and launch desktop application
        if: runner.os != 'Linux'
        run: pnpm test:release-smoke
      - name: Package and launch desktop application under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:release-smoke
      - uses: ./workspace with spaces/.github/actions/upload-test-results
        if: always()
        with:
          path: workspace with spaces/tests/.artifacts/

  browser:
    name: Browser and desktop journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser and Electron
        run: |
          pnpm exec playwright install chromium
          pnpm exec install-electron
      - name: Validate browser
        run: pnpm validate:browser
      - name: Build desktop application
        run: pnpm build:desktop-package
      - name: Run browser and desktop journeys
        run: xvfb-run --auto-servernum pnpm test:e2e:prepared
      - uses: ./.github/actions/upload-test-results
        if: always()

  validation:
    name: Validation
    if: always()
    needs:
      - quality
      - integration
      - packaging
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify validation jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
