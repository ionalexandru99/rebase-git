name: Validation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.0
          - 24.19.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build packages
        run: pnpm build

      - name: Pack package
        if: matrix.node-version == '24.19.0'
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact

      - name: Upload package
        if: matrix.node-version == '24.19.0'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package-artifact/rebase-git-*.tgz
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Integration (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        run: pnpm build:desktop-package

      - name: Run integration tests
        run: pnpm test:integration:prepared

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package-artifact

      - name: Smoke-test clean npm installation
        run: node tests/package/smoke-packed-package.ts package-artifact

  complete-tests:
    name: Complete tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run compatibility tests
        run: pnpm test:compatibility

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser integration tests
        run: pnpm test:integration:browser

      - name: Run UI tests
        run: pnpm test:ui

      - name: Prepare desktop test application
        run: |
          pnpm exec install-electron
          pnpm build:desktop-package

      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum pnpm test:e2e:prepared

      - name: Run release smoke tests
        run: xvfb-run --auto-servernum pnpm test:release-smoke:prepared

  validation:
    name: Validation
    if: always()
    needs:
      - quality
      - integration
      - package-smoke
      - complete-tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify validation jobs
        if: >-
          needs.quality.result != 'success' ||
          needs.integration.result != 'success' ||
          needs.package-smoke.result != 'success' ||
          needs.complete-tests.result != 'success'
        run: exit 1
