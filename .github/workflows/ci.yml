name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Type check & lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.2.2 --activate

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint & format check
        run: pnpm check

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.2.2 --activate

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm test:renderer

      - name: Main-process tests
        run: pnpm test:main

  test-e2e:
    name: Build & integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron's own postinstall (extract-zip) intermittently leaves dist incomplete in CI,
      # so electron.launch() fails. Fetch and unzip the matching binary deterministically.
      - name: Install Electron binary
        run: |
          set -e
          electron_version=$(node -p "require('electron/package.json').version")
          url="https://github.com/electron/electron/releases/download/v${electron_version}/electron-v${electron_version}-linux-x64.zip"
          echo "Fetching Electron ${electron_version}"
          curl -fsSL -o /tmp/electron.zip "$url"
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
          unzip -q -o /tmp/electron.zip -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          chmod +x node_modules/electron/dist/electron
          test -x node_modules/electron/dist/electron

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -f out/main/index.js
          preload=$(ls out/preload/index.{js,mjs,cjs} 2>/dev/null | head -1)
          test -n "$preload" || { echo "Preload bundle not found"; exit 1; }
          grep -q "electronAPI" "$preload" || { echo "electronAPI missing from preload"; exit 1; }

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: xvfb-run -a pnpm test:e2e

      - name: Smoke test
        run: xvfb-run -a pnpm test:smoke
