name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Type check & lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: npm install --global pnpm@11.2.2

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint & format check
        run: pnpm check

      - name: Assert a single shiki resolves
        run: pnpm check:shiki

  test-unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable pnpm
        run: npm install --global pnpm@11.2.2

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm test:renderer

      - name: Main-process tests
        run: pnpm test:main

      - name: Main-process integration tests
        run: pnpm test:main:integration

      - name: Sidecar and integration tests
        run: pnpm test:sidecar

  test-e2e:
    name: Build & integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Enable pnpm
        run: npm install --global pnpm@11.2.2

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime
        run: node scripts/ensure-electron-runtime.mjs

      - name: Build
        run: pnpm build

      - name: Verify build output
        shell: bash
        run: |
          test -f out/main/index.js
          preload=""
          for candidate in out/preload/index.js out/preload/index.mjs out/preload/index.cjs; do
            if [ -f "$candidate" ]; then
              preload="$candidate"
              break
            fi
          done
          test -n "$preload" || { echo "Preload bundle not found"; exit 1; }
          grep -q "electronAPI" "$preload" || { echo "electronAPI missing from preload"; exit 1; }

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm exec playwright test

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-test.mjs

      - name: Smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke-test.mjs
