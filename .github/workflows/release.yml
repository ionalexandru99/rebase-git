name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: Release version, such as 0.0.2 or v0.1.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-nightly-changes:
    name: Check for changes since last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Check out repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: Compare with last nightly
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag=$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*-nightly.*')
          if [[ -z "$previous_tag" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha=$(git rev-parse "$previous_tag^{commit}")
          [[ "$previous_sha" == "$GITHUB_SHA" ]] && has_changes=false || has_changes=true
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  package:
    name: Build package
    needs: check-nightly-changes
    if: |
      !failure() && !cancelled() &&
      needs.check-nightly-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
      channel: ${{ steps.request.outputs.channel }}
      dist_tag: ${{ steps.request.outputs.dist_tag }}
      integrity: ${{ steps.release.outputs.integrity }}
      name: ${{ steps.request.outputs.name }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      previous_tag: ${{ steps.request.outputs.previous_tag }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - id: request
        name: Validate release request
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'stable' }}
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          base_version=$(node -p "require('./package.json').version")
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH without a prerelease suffix." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" != "push" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must run from main. Current ref: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ "$CHANNEL" == "nightly" ]]; then
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            run_date="${created_at%%T*}"
            version="$base_version-nightly.${run_date//-/}.$RUN_NUMBER"
            dist_tag="nightly"
            name="Rebase Nightly $version (${RELEASE_SHA:0:12})"
            prerelease="true"
          elif [[ "$CHANNEL" == "stable" ]]; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              version="${REF_NAME#v}"
            else
              version="${DISPATCH_VERSION#v}"
              version="${version:-$base_version}"
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release version must use MAJOR.MINOR.PATCH: $version" >&2
              exit 1
            fi
            dist_tag="latest"
            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            if (( major >= 1 )); then
              name="Rebase v$version"
            elif (( minor >= 1 )); then
              name="Rebase Beta v$version"
            else
              name="Rebase Alpha v$version"
            fi
            prerelease="false"
          else
            echo "Unknown release channel: $CHANNEL" >&2
            exit 1
          fi

          tag="v$version"
          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$tag" ]]; then
              continue
            fi
            if [[ "$CHANNEL" == "nightly" && "$candidate" == v*-nightly.* ]]; then
              previous_tag="$candidate"
              break
            fi
            if [[ "$CHANNEL" == "stable" && "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --sort=-version:refname)

          if tag_sha=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Git tag $tag already resolves to $tag_sha." >&2
              exit 1
            fi
            if [[ "$EVENT_NAME" != "push" && "$RUN_ATTEMPT" == "1" ]]; then
              echo "Git tag $tag already exists." >&2
              exit 1
            fi
            echo "Using the existing $tag at $tag_sha."
          fi

          registry_error=$(mktemp)
          if registry_version=$(npm view "rebase-git@$version" version 2>"$registry_error"); then
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              echo "npm already contains rebase-git@$registry_version. Published versions are immutable." >&2
              exit 1
            fi
            echo "npm already contains rebase-git@$registry_version. The publish job will verify its integrity."
          elif ! grep -q "E404" "$registry_error"; then
            cat "$registry_error" >&2
            exit 1
          fi

          npm pkg set "version=$version"
          {
            echo "channel=$CHANNEL"
            echo "dist_tag=$dist_tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "previous_tag=$previous_tag"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - id: release
        name: Pack package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact

          artifact="rebase-git-$RELEASE_VERSION.tgz"
          integrity=$(node --input-type=module -e \
            "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; process.stdout.write('sha512-' + createHash('sha512').update(readFileSync('package-artifact/$artifact')).digest('base64'))")
          (cd package-artifact && sha256sum "$artifact" > "$artifact.sha256")

          {
            echo "artifact=$artifact"
            echo "integrity=$integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: package-artifact/rebase-git-*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke packed package (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - name: Smoke-test clean package installation
        run: node tests/package/smoke-packed-package.ts package-artifact

  desktop:
    name: Build desktop (${{ matrix.name }})
    needs: package
    if: ${{ !failure() && !cancelled() && needs.package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            platform: mac
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - name: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop application
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: pnpm build:desktop-package

      - name: Require Windows signing certificate
        if: ${{ matrix.platform == 'win' && env.HAS_WINDOWS_CERT != 'true' }}
        shell: bash
        run: |
          echo "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required for Windows releases." >&2
          exit 1

      - name: Package desktop application
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE != '') || (matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE != '') }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE || matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE || '' }}
          RELEASE_CHANNEL: ${{ needs.package.outputs.channel }}
        run: |
          publish_channel_args=()
          if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
            publish_channel_args=(--config.publish.channel=nightly)
          fi
          pnpm exec electron-builder \
            --config electron-builder.config.js \
            --${{ matrix.platform }} \
            --${{ matrix.arch }} \
            --config.extraMetadata.version="${{ needs.package.outputs.version }}" \
            "${publish_channel_args[@]}" \
            --publish never

      - name: Verify signature and notarization
        if: ${{ matrix.platform == 'mac' && env.HAS_MACOS_CERT == 'true' }}
        shell: bash
        run: |
          app=$(find release -maxdepth 2 -name '*.app' | head -n 1)
          if [[ -z "$app" ]]; then
            echo "No .app bundle found under release/." >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvvv "$app"
          spctl --assess --type execute -vvv "$app"
          xcrun stapler validate "$app"
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vvv "$dmg"
          done

      - name: Verify Windows signature
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer found under release/."
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is $($signature.Status)."
          }

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/nightly*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-npm:
    name: Publish npm package
    needs: [package, smoke, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - id: registry
        name: Check npm version
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          registry_error=$(mktemp)
          if published_integrity=$(npm view "rebase-git@$RELEASE_VERSION" dist.integrity 2>"$registry_error"); then
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              echo "npm already contains rebase-git@$RELEASE_VERSION. Published versions are immutable." >&2
              exit 1
            fi
            if [[ "$published_integrity" != "$EXPECTED_INTEGRITY" ]]; then
              echo "npm contains a different artifact for rebase-git@$RELEASE_VERSION." >&2
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The retry found the exact package artifact in npm."
          elif grep -q "E404" "$registry_error"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$registry_error" >&2
            exit 1
          fi

      - name: Publish with provenance
        if: steps.registry.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.package.outputs.dist_tag }}
          RELEASE_ARTIFACT: ${{ needs.package.outputs.artifact }}
        run: npm publish "./package-artifact/$RELEASE_ARTIFACT" --access public --provenance --tag "$NPM_TAG"

      - name: Verify npm metadata
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          NPM_TAG: ${{ needs.package.outputs.dist_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          for _ in {1..12}; do
            published_version=$(npm view "rebase-git@$RELEASE_VERSION" version 2>/dev/null || true)
            tagged_version=$(npm view rebase-git "dist-tags.$NPM_TAG" 2>/dev/null || true)
            published_integrity=$(npm view "rebase-git@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
            provenance=$(npm view "rebase-git@$RELEASE_VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [[ "$published_version" == "$RELEASE_VERSION" && "$tagged_version" == "$RELEASE_VERSION" && "$published_integrity" == "$EXPECTED_INTEGRITY" && "$provenance" == "https://slsa.dev/provenance/v1" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "npm metadata did not converge to the expected version, dist-tag, integrity, and provenance." >&2
          exit 1

  publish-github:
    name: Publish GitHub release
    needs: [package, desktop, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - name: Download desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          path: desktop-artifacts

      - name: Assemble desktop release assets
        shell: bash
        run: |
          mkdir desktop-release
          mac_manifest=$(basename "$(find desktop-artifacts/desktop-mac-arm64 -name '*-mac.yml')")
          yq eval-all '. as $item ireduce ({}; . *+ $item) | .files |= unique_by(.url)' \
            "desktop-artifacts/desktop-mac-arm64/$mac_manifest" \
            "desktop-artifacts/desktop-mac-x64/$mac_manifest" \
            > "desktop-release/$mac_manifest"
          find desktop-artifacts -type f ! -name '*-mac.yml' -exec mv {} desktop-release/ \;

      - id: draft
        name: Stage draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.package.outputs.name }}
          body: |
            Run `npx rebase-git@${{ needs.package.outputs.version }}` with Node.js 24 and Git 2.34 or newer.

            Source commit: `${{ github.sha }}`
            npm package: `rebase-git@${{ needs.package.outputs.version }}`
            npm integrity: `${{ needs.package.outputs.integrity }}`
          generate_release_notes: true
          previous_tag: ${{ needs.package.outputs.previous_tag }}
          draft: true
          prerelease: ${{ needs.package.outputs.prerelease }}
          files: |
            desktop-release/*.dmg
            desktop-release/*.zip
            desktop-release/*.AppImage
            desktop-release/*.deb
            desktop-release/*.exe
            desktop-release/*.blockmap
            desktop-release/*.yml
            package-artifact/${{ needs.package.outputs.artifact }}
            package-artifact/${{ needs.package.outputs.artifact }}.sha256
          fail_on_unmatched_files: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ needs.package.outputs.channel == 'stable' }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST"

      - name: Verify GitHub release metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Git tag $RELEASE_TAG resolves to $tag_sha instead of $EXPECTED_SHA." >&2
            exit 1
          fi
          if [[ "$release" != "$RELEASE_TAG"$'\tfalse\t'"$EXPECTED_PRERELEASE" ]]; then
            echo "GitHub release metadata does not match the selected channel: $release" >&2
            exit 1
          fi

  verify-registry:
    name: Smoke published package (${{ matrix.name }})
    needs: [package, publish-github]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Smoke-test clean registry installation
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: node tests/package/smoke-packed-package.ts "npm:rebase-git@$RELEASE_VERSION"

  finalize:
    name: Finalize stable release version
    needs: [package, publish-github]
    if: ${{ !failure() && !cancelled() && needs.package.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Update package version
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: npm pkg set "version=$RELEASE_VERSION"

      - name: Commit package version
        env:
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        shell: bash
        run: |
          if git diff --quiet -- package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): prepare $RELEASE_TAG"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
