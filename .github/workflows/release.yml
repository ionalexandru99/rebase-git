name: Release local package

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      publish:
        description: Publish to npm and create the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-local
  cancel-in-progress: false

jobs:
  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
      channel: ${{ steps.request.outputs.channel }}
      dist_tag: ${{ steps.request.outputs.dist_tag }}
      integrity: ${{ steps.release.outputs.integrity }}
      name: ${{ steps.request.outputs.name }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      tag: ${{ steps.request.outputs.tag }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - id: request
        name: Validate release request
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          base_version=$(node -p "require('./package.json').version")
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH without a prerelease suffix." >&2
            exit 1
          fi

          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Stable releases must run from main. Current ref: $GITHUB_REF" >&2
            exit 1
          fi

          if [[ "$CHANNEL" == "nightly" ]]; then
            version="$base_version-nightly.$(date -u +%Y%m%d).$RUN_NUMBER"
            dist_tag="nightly"
            name="Rebase Nightly $version (${RELEASE_SHA:0:12})"
            prerelease="true"
          elif [[ "$CHANNEL" == "stable" ]]; then
            version="$base_version"
            dist_tag="latest"
            name="Rebase v$version"
            prerelease="false"
          else
            echo "Unknown release channel: $CHANNEL" >&2
            exit 1
          fi

          tag="v$version"
          if tag_sha=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            if [[ "$RUN_ATTEMPT" == "1" || "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "Git tag $tag already resolves to $tag_sha." >&2
              exit 1
            fi
            echo "Retrying the release that created $tag at $tag_sha."
          fi

          registry_error=$(mktemp)
          if registry_version=$(npm view "rebase-git@$version" version 2>"$registry_error"); then
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              echo "npm already contains rebase-git@$registry_version. Published versions are immutable." >&2
              exit 1
            fi
            echo "npm already contains rebase-git@$registry_version. The publish job will verify its integrity."
          elif ! grep -q "E404" "$registry_error"; then
            cat "$registry_error" >&2
            exit 1
          fi

          npm pkg set "version=$version"
          {
            echo "channel=$CHANNEL"
            echo "dist_tag=$dist_tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - id: release
        name: Pack local application
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir package-artifact
          npm pack --pack-destination package-artifact

          artifact="rebase-git-$RELEASE_VERSION.tgz"
          integrity=$(node --input-type=module -e \
            "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; process.stdout.write('sha512-' + createHash('sha512').update(readFileSync('package-artifact/$artifact')).digest('base64'))")
          (cd package-artifact && sha256sum "$artifact" > "$artifact.sha256")

          {
            echo "artifact=$artifact"
            echo "integrity=$integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: package-artifact/rebase-git-*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke packed package (${{ matrix.name }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - name: Smoke-test clean package installation
        run: node tests/package/smoke-packed-package.ts package-artifact

  publish-npm:
    name: Publish npm package
    needs: [package, smoke]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - id: registry
        name: Check npm version
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          registry_error=$(mktemp)
          if published_integrity=$(npm view "rebase-git@$RELEASE_VERSION" dist.integrity 2>"$registry_error"); then
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              echo "npm already contains rebase-git@$RELEASE_VERSION. Published versions are immutable." >&2
              exit 1
            fi
            if [[ "$published_integrity" != "$EXPECTED_INTEGRITY" ]]; then
              echo "npm contains a different artifact for rebase-git@$RELEASE_VERSION." >&2
              exit 1
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The retry found the exact package artifact in npm."
          elif grep -q "E404" "$registry_error"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$registry_error" >&2
            exit 1
          fi

      - name: Publish with provenance
        if: steps.registry.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "package-artifact/${{ needs.package.outputs.artifact }}" --access public --provenance --tag "${{ needs.package.outputs.dist_tag }}"

      - name: Verify npm metadata
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          NPM_TAG: ${{ needs.package.outputs.dist_tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          for _ in {1..12}; do
            published_version=$(npm view "rebase-git@$RELEASE_VERSION" version 2>/dev/null || true)
            tagged_version=$(npm view rebase-git "dist-tags.$NPM_TAG" 2>/dev/null || true)
            published_integrity=$(npm view "rebase-git@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
            provenance=$(npm view "rebase-git@$RELEASE_VERSION" dist.attestations.provenance.predicateType 2>/dev/null || true)
            if [[ "$published_version" == "$RELEASE_VERSION" && "$tagged_version" == "$RELEASE_VERSION" && "$published_integrity" == "$EXPECTED_INTEGRITY" && "$provenance" == "https://slsa.dev/provenance/v1" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "npm metadata did not converge to the expected version, dist-tag, integrity, and provenance." >&2
          exit 1

  publish-github:
    name: Publish GitHub release
    needs: [package, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package-artifact

      - name: Create release at the workflow commit
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.package.outputs.name }}
          body: |
            This release runs Rebase locally through `npx`. It contains the local Environment server and browser client. It has no Git product features yet.

            Run `npx rebase-git@${{ needs.package.outputs.version }}` with Node.js 24 and Git 2.34 or newer.

            Source commit: `${{ github.sha }}`
            npm package: `rebase-git@${{ needs.package.outputs.version }}`
            npm integrity: `${{ needs.package.outputs.integrity }}`
          generate_release_notes: true
          prerelease: ${{ needs.package.outputs.prerelease }}
          make_latest: ${{ needs.package.outputs.channel == 'stable' }}
          files: |
            package-artifact/${{ needs.package.outputs.artifact }}
            package-artifact/${{ needs.package.outputs.artifact }}.sha256
          fail_on_unmatched_files: true

      - name: Verify GitHub release metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          release=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Git tag $RELEASE_TAG resolves to $tag_sha instead of $EXPECTED_SHA." >&2
            exit 1
          fi
          if [[ "$release" != "$RELEASE_TAG"$'\tfalse\t'"$EXPECTED_PRERELEASE" ]]; then
            echo "GitHub release metadata does not match the selected channel: $release" >&2
            exit 1
          fi

  verify-registry:
    name: Smoke published package (${{ matrix.name }})
    needs: [package, publish-github]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Smoke-test clean registry installation
        run: node tests/package/smoke-packed-package.ts "npm:rebase-git@${{ needs.package.outputs.version }}"
