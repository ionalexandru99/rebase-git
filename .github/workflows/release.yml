name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-nightly.*'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: Release version, such as 0.0.1 or v0.1.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: Compare HEAD to last nightly tag
        shell: bash
        run: |
          last_nightly_tag=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_sha=$(git rev-parse "$last_nightly_tag^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [[ "$last_nightly_sha" == "$head_sha" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: check-changes
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check-changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      release_channel: ${{ steps.release.outputs.release_channel }}
      ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: release
        name: Resolve release
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ) ]]; then
            nightly_date=$(date -u +%Y%m%d)
            current_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
            stable_version="${current_version%%[-+]*}"
            if [[ ! "$stable_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Invalid package version: $current_version" >&2
              exit 1
            fi
            base_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            version="$base_version-nightly.$nightly_date.$NIGHTLY_RUN_NUMBER"
            short_sha="${NIGHTLY_SHA:0:12}"
            echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=Rebase Nightly $version ($short_sha)" >> "$GITHUB_OUTPUT"
            echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            raw_version="${DISPATCH_VERSION:-$GITHUB_REF_NAME}"
            version="${raw_version#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $raw_version" >&2
              exit 1
            fi

            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            if (( major >= 1 )); then
              release_name="Rebase v$version"
              is_prerelease=false
              make_latest=true
            elif (( minor >= 1 )); then
              release_name="Rebase Beta v$version"
              is_prerelease=true
              make_latest=false
            else
              release_name="Rebase Alpha v$version"
              is_prerelease=true
              make_latest=false
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=$release_name" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
            echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:renderer && pnpm test:main && pnpm test:main:integration && pnpm test:sidecar

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package application
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE != '' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          pnpm exec electron-builder \
            --config electron-builder.config.js \
            --${{ matrix.platform }} \
            --${{ matrix.arch }} \
            --config.extraMetadata.version="${{ needs.preflight.outputs.version }}" \
            --publish never

      - name: Verify signature and notarization
        if: ${{ matrix.platform == 'mac' && env.HAS_MACOS_CERT == 'true' }}
        run: |
          app=$(find release -maxdepth 2 -name '*.app' | head -n 1)
          if [[ -z "$app" ]]; then
            echo "No .app bundle found under release/" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvvv "$app"
          spctl --assess --type execute -vvv "$app"
          xcrun stapler validate "$app"
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vvv "$dmg"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Stage draft release
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
          fail_on_unmatched_files: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST"

  finalize:
    name: Finalize release version
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Update package version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); packageJson.version = process.env.RELEASE_VERSION; writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n')"

      - name: Commit version
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): prepare $RELEASE_TAG"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
