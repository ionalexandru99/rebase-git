name: Performance

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Linux history and graph benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HISTORY_PROCESS_CORPUS_PATH: ${{ github.workspace }}/.benchmark-corpus
      HISTORY_SEARCH_REPOSITORY_PATH: ${{ github.workspace }}/.benchmark-corpus
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out Git v2.50.0 benchmark history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: git/git
          ref: 16bd9f20a403117f2e0d9bcda6c6e621d3763e77
          path: .benchmark-corpus
          fetch-depth: 100000
          fetch-tags: false
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Record benchmark environment
        shell: bash
        env:
          RUNNER_IMAGE: ${{ runner.os }}-${{ runner.arch }}
        run: |
          mkdir -p tests/.artifacts
          {
            echo "Runner: $RUNNER_IMAGE"
            echo "Image: $ImageOS $ImageVersion"
            node --version
            pnpm --version
            git --version
            git rev-parse HEAD
            git -C "$HISTORY_PROCESS_CORPUS_PATH" rev-parse HEAD
            git -C "$HISTORY_PROCESS_CORPUS_PATH" rev-list --all --count
            lscpu
            free -b
          } > tests/.artifacts/benchmark-environment.txt
      - name: Prepare baseline with the same benchmark cases
        shell: bash
        run: |
          benchmark_base_sha=$(git merge-base HEAD origin/main)
          if [ "$benchmark_base_sha" = "$(git rev-parse HEAD)" ]; then
            benchmark_base_sha=$(git rev-parse HEAD^)
          fi
          printf '%s\n' "$benchmark_base_sha" > tests/.artifacts/benchmark-base-sha.txt
          git worktree add --detach "$RUNNER_TEMP/performance-baseline" "$benchmark_base_sha"
          rm -rf "$RUNNER_TEMP/performance-baseline/tests/performance"
          cp -R tests/performance "$RUNNER_TEMP/performance-baseline/tests/performance"
          cp playwright.performance.config.ts "$RUNNER_TEMP/performance-baseline/playwright.performance.config.ts"
          cp tests/tsconfig.json "$RUNNER_TEMP/performance-baseline/tests/tsconfig.json"
          pnpm --dir "$RUNNER_TEMP/performance-baseline" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/performance-baseline" exec playwright install --with-deps chromium
      - name: Measure baseline performance
        env:
          PERFORMANCE_RECORD_BASELINE: ${{ github.workspace }}/tests/.artifacts/performance-baseline.jsonl
        run: pnpm --dir "$RUNNER_TEMP/performance-baseline" test:performance
      - name: Retain baseline reports
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/performance-baseline/tests/.artifacts" ]; then
            mkdir -p tests/.artifacts/baseline
            cp -R "$RUNNER_TEMP/performance-baseline/tests/.artifacts/." tests/.artifacts/baseline/
          fi
      - name: Compare candidate performance
        env:
          PERFORMANCE_BASELINE: ${{ github.workspace }}/tests/.artifacts/performance-baseline.jsonl
        run: pnpm test:performance
      - uses: ./.github/actions/upload-test-results
        if: always()
