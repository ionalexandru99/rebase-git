# Review-noise controls. Incremental reviews are on and the auto-pause is off, so every push to an
# open PR gets reviewed — each one files fresh threads for what that push changed. Left at its
# default of 5, the pause would stop reviewing a branch after its fifth reviewed commit.
language: en-US
tone_instructions: >-
  Follow AGENTS.md. Prioritise correctness, data-loss risk, security, and cross-platform or
  timing-sensitive issues. Do not flag style that biome enforces, and do not re-litigate decisions
  AGENTS.md or the PR description document as deliberate.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!scripts/**"
