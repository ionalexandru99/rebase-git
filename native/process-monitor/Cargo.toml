[package]
name = "rebase-process-monitor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
