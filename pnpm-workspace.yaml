packages:
  - "."

# @pierre/diffs accepts shiki ^3 || ^4; without this it resolves its own copy and we ship two.
overrides:
  '@pierre/diffs>shiki': '4.3.1'

allowBuilds:
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: false
  esbuild: false
  msgpackr-extract: false

minimumReleaseAge: 10080
